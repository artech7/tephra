services:
  tephra:
    build:
      context: .
      args:
        # match your host user so files in ./vault stay editable
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: tephra:latest
    container_name: tephra
    restart: unless-stopped
    ports:
      - "${TEPHRA_PORT:-8080}:8000"
    volumes:
      # All vaults, so the picker can switch between them.
      - /home/pureuser/Documents/vaults:/vaults
      # Settings and recents list — without this, vault choice resets on restart.
      - ./config:/config
    environment:
      # Bootstrap default only, for the very first boot before anything has
      # been remembered yet. TEPHRA_VAULT (not TEPHRA_DEFAULT_VAULT) would
      # instead pin every boot to this vault forever — main.py's lifespan
      # treats TEPHRA_VAULT as an explicit override and skips restoring
      # whatever vault was last open specifically because it's set.
      TEPHRA_DEFAULT_VAULT: /vaults/Tephra
      XDG_CONFIG_HOME: /config
      TEPHRA_MAX_UPLOAD_MB: "200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
