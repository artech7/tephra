services:
  tephra:
    build:
      context: .
      args:
        # match your host user so files in ./vault stay editable
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: tephra:latest
    container_name: tephra
    restart: unless-stopped
    ports:
      - "${TEPHRA_PORT:-8080}:8000"
    volumes:
      # This is your data. Everything else in the container is disposable.
      - ./vault:/vault
    environment:
      TEPHRA_VAULT: /vault
      TEPHRA_MAX_UPLOAD_MB: "200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
